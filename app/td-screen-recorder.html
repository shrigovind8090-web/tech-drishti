<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TD Screen Recorder — TD Store</title>
<meta name="description" content="Free screen recorder for Android with no ads, no watermark and no time limit. Full TalkBack support, secure vault and voice recorder.">
<link rel="canonical" href="https://tech-drishti.vercel.app/app/td-screen-recorder">
<meta property="og:type" content="website">
<meta property="og:site_name" content="TD Store">
<meta property="og:title" content="TD Screen Recorder">
<meta property="og:description" content="Free screen recorder for Android — no ads, no watermark, no time limit. Built with full TalkBack support.">
<meta property="og:image" content="https://tech-drishti.vercel.app/app/td-screen-recorder.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta property="og:url" content="https://tech-drishti.vercel.app/app/td-screen-recorder">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="TD Screen Recorder">
<meta name="twitter:description" content="Free screen recorder for Android — no ads, no watermark, no time limit.">
<meta name="twitter:image" content="https://tech-drishti.vercel.app/app/td-screen-recorder.png">
<meta name="theme-color" content="#0a0f1e">
<style>
 :root{--bg:#0a0f1e;--card:rgba(22,31,54,.74);--line:rgba(125,145,195,.2);--txt:#eef2ff;--mut:#93a0c0;--pri:#4f46e5;--pri2:#06b6d4;}
 *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
 body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
   padding:18px;min-height:100vh;}
 .top{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
 .back{background:transparent;border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:9px 14px;
   font-size:14px;font-weight:700;font-family:inherit;text-decoration:none;}
 .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;}
 .row{display:flex;gap:14px;align-items:flex-start;}
 img.icon{width:64px;height:64px;border-radius:16px;flex-shrink:0;}
 h1{font-size:20px;margin:0 0 4px;}
 .mut{color:var(--mut);font-size:13.5px;line-height:1.6;}
 .badge{display:inline-block;background:linear-gradient(135deg,#34d399,#10b981);color:#04231a;font-size:10.5px;
   font-weight:900;padding:3px 9px;border-radius:20px;margin-left:6px;letter-spacing:.3px;vertical-align:middle;}
 .desc{white-space:pre-wrap;line-height:1.7;margin-top:14px;font-size:14.5px;}
 .btn{display:block;width:100%;text-align:center;text-decoration:none;background:linear-gradient(135deg,var(--pri),var(--pri2));
   color:#fff;border:none;border-radius:14px;padding:16px;font-weight:800;font-size:16px;font-family:inherit;margin-top:16px;cursor:pointer;}
 .ghost{display:block;width:100%;text-align:center;text-decoration:none;background:transparent;color:var(--txt);
   border:1px solid var(--line);border-radius:14px;padding:14px;font-weight:700;font-size:15px;font-family:inherit;margin-top:10px;cursor:pointer;}
 .bar{height:6px;border-radius:6px;background:rgba(125,145,195,.22);margin-top:10px;overflow:hidden;display:none;}
 .bar.on{display:block;} .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pri),var(--pri2));transition:width .18s;}
 .lbl{font-size:11px;font-weight:800;letter-spacing:.8px;color:var(--mut);text-transform:uppercase;}
 .vrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:rgba(33,44,74,.62);
   border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px;color:var(--txt);font-family:inherit;cursor:pointer;}
 .vrow b{display:block;font-size:15px;} .vrow .m{flex:1;min-width:0;}
</style>
</head>
<body>
<div class="top"><a class="back" href="https://tech-drishti.vercel.app/">TD Store</a></div>
<div id="app"><div class="card"><div class="mut">Loading…</div></div></div>

<script>
var SLUG = "td-screen-recorder";
var REPO = "shrigovind8090-web/td-store";
var SITE = "https://tech-drishti.vercel.app";
var STORE = null, DESC_OPEN = false, OLD_SHOWN = 3;
/* files we host ourselves — built in, so a failed fetch can never send
   anyone to GitHub instead */
var HOSTED = { "td-screen-recorder-1.0.0": 1 };

function fmtSize(b){ b=Number(b)||0; if(!b) return ""; var u=["B","KB","MB","GB"], i=0;
  while(b>=1024 && i<u.length-1){ b/=1024; i++; } return (b>=10?Math.round(b):b.toFixed(1))+" "+u[i]; }
function esc(t){ return String(t==null?"":t).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

fetch(SITE+"/apps/manifest.json?t="+Date.now())
  .then(function(r){ return r.json(); })
  .then(function(m){ if(m && typeof m==="object"){ for(var k in m) HOSTED[k]=1; } })
  .catch(function(){})
  .then(function(){ return fetch("https://api.github.com/repos/"+REPO+"/releases?per_page=60"); })
  .then(function(r){ return r.json(); })
  .then(function(rel){
    var groups={}, order=[];
    (rel||[]).filter(function(r){ return !r.draft; }).forEach(function(r){
      var nm=(r.name||r.tag_name||"App").trim(), key=nm.toLowerCase();
      var apk=(r.assets||[]).filter(function(a){ return /\.apk$/i.test(a.name); })[0];
      if(!groups[key]){ groups[key]={name:nm,versions:[]}; order.push(key); }
      groups[key].versions.push({ version:r.tag_name||"", notes:r.body||"",
        ts:r.published_at?new Date(r.published_at).getTime():0, date:r.published_at||"",
        size:apk?apk.size:0, url:apk?apk.browser_download_url:"" });
    });
    STORE = order.map(function(k){ var g=groups[k];
      g.versions.sort(function(a,b){ return (b.ts||0)-(a.ts||0); });
      g.latest=g.versions[0]||null; return g; });
    var found=null;
    for(var i=0;i<STORE.length;i++){
      if(STORE[i].name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")===SLUG){ found=STORE[i]; break; }
    }
    if(found) paint(found); else paint(null);
  })
  .catch(function(){ paint(null); });

function dlUrl(v){
  var key = SLUG + "-" + String(v.version||"");
  return HOSTED[key] ? (SITE+"/apps/"+key+".apk") : (v.url||"");
}
function paint(a){
  var box=document.getElementById("app");
  if(!a){ box.innerHTML='<div class="card"><div class="mut">This app is not available right now. '+
    '<a href="'+SITE+'/" style="color:#7dd3fc">Open TD Store</a></div></div>'; return; }
  var v=a.latest, notes=(v.notes||"").trim();
  var short=notes.length>180 ? notes.slice(0,180).replace(/\s+\S*$/,"")+"…" : notes;
  var shown=DESC_OPEN?notes:short;
  var meta=[]; if(v.version) meta.push("Version "+v.version);
  if(v.size) meta.push(fmtSize(v.size));
  if(v.date){ try{ meta.push(new Date(v.date).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"})); }catch(e){} }
  var url=dlUrl(v), fname=SLUG+"-"+String(v.version||"1")+".apk";
  var html='<div class="card"><div class="row">'+
    '<img class="icon" src="/app/'+SLUG+'.png" alt="">'+
    '<div style="flex:1;min-width:0"><h1>'+esc(a.name)+'</h1>'+
    '<div class="mut">'+esc(meta.join(" · "))+'<span class="badge">LATEST</span></div></div></div>'+
    (notes? '<div class="desc">'+esc(shown)+'</div>'+
      (notes.length>180 ? '<button class="ghost" onclick="toggleDesc()">'+(DESC_OPEN?"Show less":"Show more")+'</button>' : '')
      : '<div class="mut" style="margin-top:12px">No description was added for this version.</div>')+
    (url ? '<button class="btn" id="dl" onclick="startDownload()">Download</button>'+
           '<div class="bar" id="bar"><i></i></div>'+
           '<button class="ghost" id="dlAgain" hidden style="margin-top:10px" onclick="startDownload()">Download again</button>'+
           '<div class="mut" style="margin-top:10px">The download starts at once and saves to your phone. When it finishes, open it from your notifications to install.</div>'+
           '<div class="mut" style="margin-top:6px">If your browser shows a warning about this file, choose Download anyway. Nothing is wrong with the file.</div>'
         : '<div class="mut" style="margin-top:14px">This version is not ready to download yet.</div>')+
    '<a class="ghost" href="'+SITE+'/">Open TD Store</a></div>';
  var older=a.versions.slice(1);
  if(older.length){
    var shown2=Math.min(OLD_SHOWN,older.length);
    html+='<div class="card"><div class="lbl">Download old versions</div>'+
      older.slice(0,shown2).map(function(ov,k){
        var m=[]; if(ov.size) m.push(fmtSize(ov.size));
        if(ov.date){ try{ m.push(new Date(ov.date).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"})); }catch(e){} }
        return '<button class="vrow" onclick="openOld('+(k+1)+')"><span class="m"><b>'+esc(ov.version?"v"+ov.version:"Version")+
          '</b><span class="mut">'+esc(m.join(" · "))+'</span></span><span aria-hidden="true"></span></button>';
      }).join("");
    if(shown2<older.length) html+='<button class="ghost" onclick="moreOld()">Show more</button>';
    html+='</div>';
  }
  box.innerHTML=html;
  window.__APP=a;
}
function toggleDesc(){ DESC_OPEN=!DESC_OPEN; paint(window.__APP); }
function moreOld(){ OLD_SHOWN+=3; paint(window.__APP); }
function openOld(i){ var a=window.__APP, v=a.versions[i]; DESC_OPEN=false; window.__APP=null;
  paint({ name:a.name, versions:[v], latest:v }); }

function startDownload(){
  var a=window.__APP; if(!a) return; var v=a.latest;
  var url=dlUrl(v), fname=SLUG+"-"+String(v.version||"1")+".apk";
  var btn=document.getElementById("dl"), bar=document.getElementById("bar");
  if(!url) return;
  if(btn.dataset.busy) return; btn.dataset.busy="1";
  if(bar) bar.classList.add("on");
  function pct(p){ btn.textContent="Downloading… "+p+"%"; if(bar) bar.querySelector("i").style.width=p+"%"; }
  fetch(url,{cache:"no-store"}).then(function(resp){
    if(!resp.ok) throw new Error("http");
    var total=Number(resp.headers.get("content-length"))||0;
    var reader=resp.body.getReader(), chunks=[], got=0;
    if(total) pct(0);
    function step(){
      return reader.read().then(function(r){
        if(r.done) return;
        chunks.push(r.value); got+=r.value.length;
        if(total) pct(Math.min(100,Math.round(got*100/total)));
        else btn.textContent="Downloading… "+fmtSize(got);
        return step();
      });
    }
    return step().then(function(){
      var blob=new Blob(chunks,{type:"application/vnd.android.package-archive"});
      var a2=document.createElement("a"); a2.href=URL.createObjectURL(blob); a2.download=fname;
      document.body.appendChild(a2); a2.click(); a2.remove();
      setTimeout(function(){ try{ URL.revokeObjectURL(a2.href); }catch(e){} },60000);
      pct(100); btn.textContent="Downloaded";
    });
  }).catch(function(){
    var a3=document.createElement("a"); a3.href=url; a3.download=fname;
    document.body.appendChild(a3); a3.click(); a3.remove();
    btn.textContent=" Download";
  }).then(function(){
    delete btn.dataset.busy;
    var again=document.getElementById("dlAgain"); if(again) again.hidden=false;
    setTimeout(function(){ btn.textContent=" Download"; if(bar){ bar.classList.remove("on"); bar.querySelector("i").style.width="0"; } },4000);
  });
}
</script>
</body>
</html>
